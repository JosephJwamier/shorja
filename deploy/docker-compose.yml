# الشورجة — إنتاج. يشغَّل من مجلد المشروع:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# خمس عمليات، كل واحدة تموت وتُبعث وحدها:
#   db       MySQL — الحالة الوحيدة التي لا تُعوَّض، لها حجم دائم ونسخ احتياطي
#   redis    ذاكرة مؤقتة + وسيط Celery + طبقة Channels (WebSocket)
#   web      daphne — HTTP و WebSocket معاً (ASGI)، لا gunicorn
#   worker   Celery — إشعارات، تنظيف، تحرير مدفوعات
#   beat     جدولة Celery — إغلاق المزادات كل دقيقة؛ **نسخة واحدة فقط**
#   caddy    TLS تلقائي + الملفات الثابتة والوسائط
#   srs      سيرفر البثّ (WHIP/WHEP/HLS) — على شبكة المضيف
#   coturn   مرحّل لمن هو خلف CGNAT (أكثر خطوط الجوّال العراقية)
#
# البثّ يشارك هذا الخادم بقرار؛ ما يعنيه ذلك وحدوده في deploy/README.md
# تحت «البثّ على نفس الخادم».
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # يطابق settings.DATABASES['OPTIONS']['init_command'] — المنطق المالي
      # يعتمد على رفض MySQL للقيم المبتورة بدل قبولها صامتة.
      - --sql-mode=STRICT_TRANS_TABLES
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # جداول المناطق الزمنية: TIME_ZONE=Asia/Baghdad يجعل Django يغلّف كل
      # استعلام تاريخ بـ CONVERT_TZ، وهي تُرجع NULL على MySQL جديد. يحمّلها
      # init-timezones.sh مرة واحدة عند أول إقلاع — بدونها يرفض core/checks.py
      # (core.E001) تشغيل migrate أصلاً.
      - ./init-timezones.sh:/docker-entrypoint-initdb.d/00-timezones.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: مهام Celery المجدولة لا تضيع عند إعادة تشغيل الخادم.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    # daphne لا gunicorn: الدردشة والبث المباشر على WebSocket، وWSGI لا يحملها.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 balla.asgi:application"
    # Django يقرأ قائمة HLS من SRS ليوقّع روابط مقاطعها، وSRS على شبكة
    # المضيف لا على شبكة compose — فيُنادى عبر host-gateway كما يناديه
    # Caddy. وSRS_HLS_ORIGIN في .env يطابق هذا.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # على الحلقة المحلية وحدها — ليس مدخلاً عامّاً ثانياً. SRS على شبكة
    # المضيف ولا يرى شبكة compose، وهو يسأل Django عند كل نشر وكل مشاهدة
    # (on_publish / on_play). المرور عبر api.shorjeh.com والعودة كان سيضع
    # رحلة عامة كاملة في مسار كل مشاهد يضغط «شاهد».
    #
    # يتطلب وجود 127.0.0.1 في ALLOWED_HOSTS، وإلا ردّ Django بـ400 على كل
    # خطّاف، ورآه SRS رفضاً فمنع كل بثّ وكل مشاهدة بلا سبب ظاهر.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    command: celery -A balla worker -l info --concurrency=2
    volumes:
      - media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    # نسخة واحدة فقط مهما توسّعت: نسختان تعنيان إغلاق كل مزاد مرتين
    # وتحرير كل دفعة مرتين.
    command: celery -A balla beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # يسأل Caddy عن كل قائمة ومقطع HLS قبل خدمته، ويثبت أنه نحن بهذا
    # السرّ نفسه — انظر handle /live/* في Caddyfile. فارغاً يردّ Django
    # 403 على كل طلب فلا يعمل البثّ البديل إطلاقاً.
    environment:
      SRS_HOOK_SECRET: ${SRS_HOOK_SECRET}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Caddy يخدم الوسائط والثابت مباشرة — أسرع من Django، والأهم أن
      # urls.py يتوقف عن خدمتها كلياً عند DEBUG=False.
      - media:/srv/media:ro
      - static:/srv/static:ro
    # SRS وcoturn على شبكة المضيف، فلا يُناديان باسم خدمة من هنا.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web

  # سيرفر البثّ. شبكة المضيف ليست ترفاً: مرشّحات ICE تحمل عنوان المضيف
  # ومنافذه، وخلف NAT دوكر يُعلن عنواناً لا يصله أحد — فتكتمل المصافحة ولا
  # تأتي صورة، وهي حالة أسوأ من فشل صريح لأن لا شيء فيها يُشتكى منه.
  srs:
    image: ossrs/srs:5
    restart: unless-stopped
    network_mode: host
    environment:
      CANDIDATE: ${PUBLIC_IP}
      DJANGO_HOOK_BASE: ${DJANGO_HOOK_BASE:-http://127.0.0.1:8000}
      SRS_HOOK_SECRET: ${SRS_HOOK_SECRET}
      # مطفأ على خادم مشترك: dvr_plan session يكتب MP4 كاملاً لكل جلسة بلا
      # سقف ولا تنظيف (on_dvr يسجّل المسار ولا يرفع شيئاً بعد)، والقرص هنا
      # قرص MySQL — امتلاؤه يوقف السوق كلّه لا البثّ وحده.
      SRS_DVR: ${SRS_DVR:-off}
    volumes:
      - ../infra/live/srs.conf:/usr/local/srs/conf/docker.conf:ro
      - srs_dvr:/usr/local/srs/objs/nginx/html/dvr
    # مقاطع HLS تُكتب وتُحذف كل ثانيتين طوال كل بثّ. في الرام لا على قرص
    # قاعدة البيانات: النافذة عشرون ثانية لكل بثّ، ومقطع ينتهي قبل إعادة
    # التشغيل التالية لا شيء يُفقد بعدم حفظه.
    tmpfs:
      - /usr/local/srs/objs/nginx/html/live:size=256m
    # يُكتب الإعداد قبل أن يُقرأ: SRS لا يستبدل متغيّرات البيئة في ملفّه،
    # فـ`sed` تملأ النائبين كما تفعل coturn أدناه. و`/tmp` لأن الملفّ
    # المركَّب مقروء فقط.
    command: >
      sh -c "sed -e 's|__HOOK_BASE__|'\"$$DJANGO_HOOK_BASE\"'|g' -e 's|__HOOK_SECRET__|'\"$$SRS_HOOK_SECRET\"'|g'
      /usr/local/srs/conf/docker.conf > /tmp/srs.conf && exec ./objs/srs -c /tmp/srs.conf"
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:1985/api/v1/versions >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  # مرحّل الوسائط. شهادة turns: مستعارة من Caddy للقراءة فقط — لا شهادة
  # ثانية تُجدّد وحدها وتنتهي صامتةً.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET}
      PUBLIC_IP: ${PUBLIC_IP}
      LIVE_DOMAIN: ${TURN_HOST}
    volumes:
      - ../infra/live/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/certs:ro
    command: >
      sh -c "sed -e 's|__TURN_SECRET__|'\"$$TURN_SECRET\"'|' -e 's|__PUBLIC_IP__|'\"$$PUBLIC_IP\"'|' -e 's|__LIVE_DOMAIN__|'\"$$LIVE_DOMAIN\"'|'
      /etc/coturn/turnserver.conf > /tmp/turnserver.conf && turnserver -c /tmp/turnserver.conf"
    depends_on:
      - caddy

volumes:
  db_data:
  redis_data:
  media:
  static:
  caddy_data:
  caddy_config:
  srs_dvr:
