<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ campaign.headline }} — كتيّب الشورجة</title>
<meta name="description" content="{{ campaign.lede }}">
<link rel="canonical" href="{{ canonical }}">
<link rel="icon" href="{{ icon_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="الشورجة">
<meta property="og:title" content="{{ campaign.headline }}">
<meta property="og:description" content="{{ campaign.lede }}">
<meta property="og:image" content="{{ cover_url }}">
<meta property="og:url" content="{{ canonical }}">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #2b1509; color: #ffecc9; font: 700 1rem/1.5 Tajawal, system-ui, Tahoma, sans-serif;
         display: flex; flex-direction: column; overflow: hidden; height: 100dvh; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; perspective: 2200px; }
  .book { position: relative; aspect-ratio: 148/210; height: min(100%, calc((100vw - 28px) * 210 / 148)); touch-action: pan-y; }
  .page { position: absolute; inset: 0; transform-origin: right center; transition: transform .7s cubic-bezier(.3,.1,.2,1), visibility 0s .7s;
          backface-visibility: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); background: #ffecc9; }
  .page img { display: block; width: 100%; height: 100%; }
  /* كتاب عربي: كعبه يمين، والصفحة تُقلب من اليسار إلى اليمين. */
  .page.turned { transform: rotateY(105deg); visibility: hidden; }
  nav { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 8px 14px calc(14px + env(safe-area-inset-bottom)); }
  button, nav a { min-height: 48px; min-width: 48px; border-radius: 14px; border: 2px solid #ffecc9; background: none; color: inherit;
         font: inherit; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  nav a { background: #e4611a; border-color: #e4611a; color: #fff; }
  /* رسم لا محرفا ‹ ›: المتصفّح يعكسهما في النص العربي فيشيران إلى الضدّ. */
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, nav a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #count { min-width: 64px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .page { transition: none; } }
</style>
</head>
<body>
<div class="stage"><div class="book" id="book">
  {% for page in pages %}<div class="page"><img src="{{ page }}" alt="صفحة {{ forloop.counter }} من كتيّب: {{ campaign.headline }}" draggable="false"></div>{% endfor %}
</div></div>
<nav aria-label="تقليب الكتيّب">
  <button id="prev" type="button" aria-label="الصفحة السابقة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <span id="count" aria-live="polite">١ / ٨</span>
  <button id="next" type="button" aria-label="الصفحة التالية"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <a href="{% url 'campaign-landing' campaign.code %}?s=web">حمّل التطبيق</a>
</nav>
<script src="{{ script_url }}"></script>
</body>
</html>
