# SRS 5.x — live shopping: WHIP in from the seller's phone, WHEP out to
# viewers, HLS as the fallback, and Django as the authority on who may
# publish or play (http_hooks). Env vars are expanded by SRS at start:
# CANDIDATE, DJANGO_HOOK_BASE, SRS_HOOK_SECRET (from docker-compose .env).

listen              1935;          # RTMP ingest (OBS / desktop encoders) — optional
max_connections     2000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

http_api {
    enabled         on;
    listen          1985;          # local only; Caddy exposes /api/ read-only paths
    crossdomain     off;
}

http_server {
    enabled         on;
    listen          8080;          # HLS + WHIP/WHEP signalling; fronted by Caddy on 443
    dir             ./objs/nginx/html;
    crossdomain     on;
}

rtc_server {
    enabled         on;
    listen          8000;          # UDP media
    # The public IP viewers connect to. Bare-metal has a single public
    # address so this is fixed; if the box ever gets NATed, keep the env.
    candidate       $CANDIDATE;
    # WebRTC over TCP for networks that drop UDP (some carrier hotspots).
    #
    # 8001, not 8000: SRS runs with network_mode: host, and on the shared
    # api.shorjeh.com box daphne is already published on 127.0.0.1:8000
    # (deploy/docker-compose.yml). Binding 0.0.0.0:8000 overlaps that and
    # fails with EADDRINUSE — and SRS treats a listener it cannot bind as
    # fatal, so the container crash-looped and there was no live at all,
    # not even over UDP, which had bound fine. UDP 8000 below is a separate
    # namespace and keeps its port; SRS advertises this one in its own TCP
    # ICE candidates, so clients need no change.
    tcp {
        enabled     on;
        listen      8001;
    }
    # Iraqi mobile links are jittery; let SRS request keyframes and
    # smooth delivery rather than dropping viewers on the first loss.
    use_auto_detect_network_ip off;
}

vhost __defaultVhost__ {
    # ── WebRTC ────────────────────────────────────────────────────────────
    rtc {
        enabled         on;
        # Publish via WHIP (WebRTC) or RTMP; play via WHEP (WebRTC) or HLS.
        rtmp_to_rtc     on;        # RTMP publishers (OBS) reach WebRTC viewers
        rtc_to_rtmp     on;        # WHIP publishers also feed HLS/DVR
        # Keep the stream alive across brief disconnects (phone switched
        # from Wi‑Fi to 4G) instead of tearing viewers down immediately.
        stun_timeout    30;
        nack            on;
        twcc            on;
        # Playing viewers only receive; drop their audio uplink entirely.
        drop_for_pt     0;
    }

    # ── HLS fallback ──────────────────────────────────────────────────────
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;          # 2 s segments → ~6 s glass-to-glass
        hls_window      20;
        hls_cleanup     on;
        hls_dispose     30;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # ── Recording (DVR) — sessions land as MP4 for later upload to S3 ──────
    # A switch, not a constant: `session` writes one unbounded MP4 per
    # broadcast and on_dvr only logs where it landed, so nothing deletes or
    # uploads them. Alone on a dedicated box that is merely untidy; sharing
    # a disk with MySQL it is a way to stop the whole marketplace, so the
    # deployment sets SRS_DVR=off until recordings have somewhere to go.
    dvr {
        enabled         $SRS_DVR;
        dvr_path        ./objs/nginx/html/dvr/[app]/[stream].[timestamp].mp4;
        dvr_plan        session;
        dvr_wait_keyframe on;
    }

    # ── Authority stays in Django ─────────────────────────────────────────
    # SRS POSTs JSON to these URLs and refuses the action unless the reply
    # is `{"code": 0}`. The shared secret rides in the query string so a
    # stray request from the internet cannot impersonate SRS.
    # عنصران نائبان يُستبدلان عند الإقلاع — لا متغيّرات بيئة.
    #
    # SRS لا يستبدل متغيّرات البيئة في ملفّ الإعداد عموماً. و`$CANDIDATE`
    # أعلاه يعمل لأنه حالة خاصّة في شيفرة SRS نفسها (قارئ candidate يفحص
    # البادئة `$` وينادي getenv)، لا قاعدة عامّة. جُرّب الاثنان هنا وفشلا:
    #
    #     parse url $DJANGO_HOOK_BASE/api/... failed    ← متغيّر مُضمَّن
    #     parse url $HOOK_ON_PUBLISH as ... failed      ← وقيمة كاملة أيضاً
    #
    # ورابطٌ لا يُحلَّل يعني خطّافاً يفشل، وفشلُ on_publish رفضٌ للنشر —
    # فلم يكن البثّ يعمل قطّ. والأخطر أن on_play كان يفشل كذلك، وهو ما
    # ينفّذ الحظر وشرط «الجلسة مباشرة» على خادم الوسائط نفسه.
    #
    # فالحلّ أن يُكتب الملفّ قبل أن يقرأه SRS: `sed` في أمر الحاوية يملأ
    # النائبين، تماماً كما تفعل coturn مع turnserver.conf في نفس الملفّ.
    http_hooks {
        enabled         on;
        on_publish      __HOOK_BASE__/api/live/srs/on_publish/?secret=__HOOK_SECRET__;
        on_unpublish    __HOOK_BASE__/api/live/srs/on_unpublish/?secret=__HOOK_SECRET__;
        on_play         __HOOK_BASE__/api/live/srs/on_play/?secret=__HOOK_SECRET__;
        on_stop         __HOOK_BASE__/api/live/srs/on_stop/?secret=__HOOK_SECRET__;
        on_dvr          __HOOK_BASE__/api/live/srs/on_dvr/?secret=__HOOK_SECRET__;
    }

    # Publisher-side tuning for phones: accept whatever the app sends;
    # no server-side transcode (keeps CPU near zero per stream).
    publish {
        mr              off;
        firstpkt_timeout 20000;
        normal_timeout  7000;
    }
    play {
        gop_cache       on;         # new viewers get a picture immediately
        queue_length    10;
        mw_latency      100;
    }
}
