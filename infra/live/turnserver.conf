# coturn — relays WebRTC media for viewers/publishers behind CGNAT (most
# Iraqi mobile lines). Credentials are short-lived and minted by Django with
# the same secret (TURN REST API, see core/services/live_media/srs.py), so
# nothing here is per-user and nothing needs restarting to add users.
#
# Placeholders are substituted at container start from docker-compose .env.

listening-port=3478
tls-listening-port=5349
# Also answer on 443 so carrier firewalls that only pass "HTTPS" still work.
alt-listening-port=443

listening-ip=0.0.0.0
external-ip=__PUBLIC_IP__
realm=__LIVE_DOMAIN__
server-name=__LIVE_DOMAIN__

# Relay port range — keep narrow and open it in ufw (bootstrap.sh).
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=__TURN_SECRET__

# TLS for turns: — Caddy's certificate is mounted read-only at /certs.
cert=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/__LIVE_DOMAIN__/__LIVE_DOMAIN__.crt
pkey=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/__LIVE_DOMAIN__/__LIVE_DOMAIN__.key

# Hygiene: this is a relay for our streams, not an open proxy.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# Per-user relay cap: one 1080p publisher never needs more than this.
user-quota=12
total-quota=1200
max-bps=4000000
log-file=stdout
verbose
